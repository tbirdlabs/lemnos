; The Salient radio co-processor. One source tree; each [env:] is a board. Build:  pio run -e esp32dev
; First run  python tools/get_bluepad32.py  (once). The boards differ only in RADIO_BOARD (main/board.h).
[platformio]
src_dir = main
default_envs = esp32dev, nodemcu-32s, ttgo-t-display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf
board_build.partitions = partitions.csv
; the web pages, embedded in the firmware (also listed in main/CMakeLists.txt; PlatformIO needs both)
board_build.embed_txtfiles =
    web/index.html
    web/pad.html
monitor_speed = 115200
monitor_filters = direct

; Reference: any ESP32-WROOM-32 dev board ("ESP32 DevKitC" and its clones)
[env:esp32dev]
board = esp32dev
board_build.cmake_extra_args = -DRADIO_BOARD=esp32dev

; NodeMCU-32S (Ai-Thinker ESP-32S): the same pins as esp32dev; the header order differs, so wire by the silkscreen
[env:nodemcu-32s]
board = nodemcu-32s
board_build.cmake_extra_args = -DRADIO_BOARD=nodemcu32s

; LilyGO TTGO T-Display (ESP32 + 1.14" ST7789): UART on GPIO25/26, since GPIO16 is the display's DC line
[env:ttgo-t-display]
board = esp32dev
board_build.cmake_extra_args = -DRADIO_BOARD=ttgo_t_display
